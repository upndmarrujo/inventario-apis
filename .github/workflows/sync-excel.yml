name: Sincronizar Excel desde SharePoint

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Descargar Excel desde SharePoint
        run: |
          SHARE_URL="https://comunidadupnedu-my.sharepoint.com/:x:/g/personal/n00207800_upn_pe/IQDFhnD4aKxVT5z5YK834uusAZkepzQMR3PM1XlHJ1w8meY?e=0flwcf&download=1"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          curl -L -f -A "$UA" -c cookies.txt -o data.xlsx "$SHARE_URL"

      - name: Diagnóstico - ver qué se descargó realmente
        run: |
          echo "--- Tipo de archivo detectado ---"
          file data.xlsx
          echo "--- Tamaño en bytes ---"
          wc -c data.xlsx
          echo "--- Primeras 300 caracteres (para ver si es HTML/login) ---"
          head -c 300 data.xlsx

      - name: Verificar que el archivo descargado es un Excel válido
        run: |
          file data.xlsx
          test -s data.xlsx

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.xlsx
          if git diff --staged --quiet; then
            echo "Sin cambios en el Excel, no se hace commit."
          else
            git commit -m "Actualizar Excel automáticamente (sync SharePoint)"
            git push
          fi
