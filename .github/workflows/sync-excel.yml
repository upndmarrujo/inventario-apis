name: Sincronizar Excel desde SharePoint

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Descargar Excel desde SharePoint (vía API de shares de Microsoft)
        run: |
          SHARE_URL="https://comunidadupnedu-my.sharepoint.com/:x:/g/personal/n00207800_upn_pe/IQD4qfltzb83RouhRznc9CtjAaUk-hLKCVszzuvTBzU5Lok?e=sCFJje"
          B64=$(echo -n "$SHARE_URL" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          ENCODED="u!$B64"
          curl -L -f -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -o data.xlsx "https://api.onedrive.com/v1.0/shares/$ENCODED/root/content"

      - name: Diagnóstico - ver qué se descargó realmente
        run: |
          echo "--- Tipo de archivo detectado ---"
          file data.xlsx
          echo "--- Tamaño en bytes ---"
          wc -c data.xlsx
          echo "--- Primeras 300 caracteres (para ver si es HTML/login) ---"
          head -c 300 data.xlsx

      - name: Verificar que el archivo descargado es un Excel válido
        run: |
          file data.xlsx
          test -s data.xlsx

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.xlsx
          if git diff --staged --quiet; then
            echo "Sin cambios en el Excel, no se hace commit."
          else
            git commit -m "Actualizar Excel automáticamente (sync SharePoint)"
            git push
          fi
