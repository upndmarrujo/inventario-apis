name: Sincronizar Excel desde SharePoint

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Descargar Excel desde SharePoint (resolviendo la página de redirección)
        run: |
          SHARE_URL="https://comunidadupnedu-my.sharepoint.com/:x:/g/personal/n00207800_upn_pe/IQD4qfltzb83RouhRznc9CtjAaUk-hLKCVszzuvTBzU5Lok?e=sCFJje&download=1"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"

          echo "Paso 1: obteniendo la página de redirección..."
          curl -L -s -A "$UA" -c cookies.txt -o redirect.html "$SHARE_URL"

          echo "Paso 2: buscando la URL real dentro del HTML..."
          REAL_URL=$(grep -oE '(https://[^"'"'"']+)' redirect.html | grep -iE 'download|\.xlsx|getfile|contentstream' | head -1)

          if [ -z "$REAL_URL" ]; then
            echo "No se encontró una URL de descarga dentro de la página. Contenido completo para depurar:"
            cat redirect.html
            exit 1
          fi

          echo "URL real encontrada: $REAL_URL"
          echo "Paso 3: descargando el archivo real..."
          curl -L -f -A "$UA" -b cookies.txt -o data.xlsx "$REAL_URL"

      - name: Diagnóstico - ver qué se descargó realmente
        run: |
          echo "--- Tipo de archivo detectado ---"
          file data.xlsx
          echo "--- Tamaño en bytes ---"
          wc -c data.xlsx
          echo "--- Primeras 300 caracteres (para ver si es HTML/login) ---"
          head -c 300 data.xlsx

      - name: Verificar que el archivo descargado es un Excel válido
        run: |
          file data.xlsx
          test -s data.xlsx

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.xlsx
          if git diff --staged --quiet; then
            echo "Sin cambios en el Excel, no se hace commit."
          else
            git commit -m "Actualizar Excel automáticamente (sync SharePoint)"
            git push
          fi
